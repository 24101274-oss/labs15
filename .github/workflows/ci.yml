name: React CI/CD Pipeline with software testing and DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release_url/$archive" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: Scan repository history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --log-opts=--all .'

  sbom:
    name: Generate dependency SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Generate CycloneDX SBOM from the lockfile
        run: |
          npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
          node -e "const sbom = require('./sbom.cdx.json'); if (sbom.bomFormat !== 'CycloneDX' || !sbom.components?.length) throw new Error('Expected a CycloneDX SBOM with components');"

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

  tests:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [tests, dependency-audit, secret-scan, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      vercel_url: ${{ steps.deploy-vercel.outputs.DEPLOY_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Deploy to Vercel
        id: deploy-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::The VERCEL_TOKEN repository secret is missing."
            exit 1
          fi
          if [[ -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::The VERCEL_ORG_ID and VERCEL_PROJECT_ID repository variables are required."
            exit 1
          fi

          url=$(npx --yes vercel@65.14.0 deploy --prod --yes --token "$VERCEL_TOKEN")
          if [[ ! "$url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Vercel did not return a valid deployment URL."
            exit 1
          fi
          printf 'DEPLOY_URL=%s\n' "$url" >> "$GITHUB_OUTPUT"

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout Cypress repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This public repository can be read with the default GitHub Actions token.
          repository: 24101274-oss/cypress15
          path: cypress-tests
          persist-credentials: false

      - name: Set up Node.js for Cypress
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npx cypress install
        working-directory: cypress-tests

      - name: Run Cypress Tests
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7
        env:
          CYPRESS_BASE_URL: ${{ vars.VERCEL_PRODUCTION_URL || needs.deploy.outputs.vercel_url }}
          ELECTRON_DISABLE_GPU: '1'
          DISABLE_X1IR_WORKAROUNDS: 'true'
        with:
          working-directory: cypress-tests
          browser: chrome
          install: false
          component: false
          record: false
          publish-summary: true

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cypress-screenshots
          path: cypress-tests/cypress/screenshots/
          if-no-files-found: ignore
